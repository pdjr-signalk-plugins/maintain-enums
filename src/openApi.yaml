openapi: 3.0.3
info:
  title: Maintain enums API
  version: 2026.10.23
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    [maintain-enums](https://github.com/pdjr-signalk-plugins/maintain-enums)
    is a plugin for the
    [Signal K node server](https://github.com/SignalK/signalk-server).

    A Signal K server hosting the plugin will present this API under
    the root https://*server_ip*:*server_port*/plugins/maintain-enums.
externalDocs:
  description: Plugin README document
  url: https://github.com/pdjr-signalk-plugins/maintain-enums#readme 
paths:
  /status:
    get:
      description: |
        Get the status of all configured enumerations.
      responses:
        '200':
          description: |
            Success.
            The response body is an object containing a status report
            for each defined enumeration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    value:
                      description: Current enumeration (range) value
                      type: string
                      example: No special maneuver
                    source:
                      description: Source path
                      type: string
                      example: electrical.switches.bank.12.4.state
                    sourceValue:
                      description: Current source value
                      type: number
                      example: 0
        '500':
          description: |
            Error.
            The server was unable to service the request.